name: Frontend CD (Docker & Release)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Frontend Container & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Inject Production .env
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          if [ -n "$FRONTEND_ENV" ]; then
            printf "%s\n" "$FRONTEND_ENV" > .env
            echo "Production .env injected successfully into build context."
          else
            echo "FRONTEND_ENV secret not set; using build defaults."
          fi

      - name: Validate Firebase Web Push configuration
        run: |
          required_vars="VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_VAPID_KEY"
          missing_vars=""
          for name in $required_vars; do
            if ! awk -F= -v key="$name" '$1 == key { value = substr($0, index($0, "=") + 1); if (value ~ /[^[:space:]]/) found = 1 } END { exit !found }' .env; then
              missing_vars="$missing_vars $name"
            fi
          done
          if [ -n "$missing_vars" ]; then
            echo "::error::Missing or empty Firebase frontend variables in FRONTEND_ENV:$missing_vars"
            exit 1
          fi
          echo "Firebase Web Push configuration is complete."

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production Host via SSH
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            cd /opt/course-rep
            if [ -f "docker-compose.prod.yaml" ]; then
              docker compose -f docker-compose.prod.yaml up -d --no-deps frontend
            else
              docker compose up -d --no-deps frontend
            fi
            # Verify Nginx container healthcheck
            for i in {1..10}; do
              if docker exec rep-frontend wget --spider -q http://127.0.0.1; then
                echo "Frontend container verified healthy."
                exit 0
              fi
              echo "Waiting for frontend health check ($i/10)..."
              sleep 3
            done
            echo "Frontend health check failed!"
            exit 1
