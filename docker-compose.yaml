services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rep-frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - v2_course-rep-network

networks:
  v2_course-rep-network:
    external: true
