services:
  frontend:
    image: ghcr.io/lord-joeh/course-rep-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rep-frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - course-rep-network

networks:
  course-rep-network:
    external: true
